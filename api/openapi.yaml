      summary: Calcul des frais Partenaire To Wallet (P2W)
      tags:
      - Transactions v2
  /api/v2/nitaServices/envoi-inter-partenaire/frais:
    post:
      description: "Calcule les frais d'un envoi entre le partenaire authentifie et\
        \ un partenaire destinataire (identifie par alias), sans debit. Meme resolution\
        \ inter-organisation et meme bareme que le debit reel.\r\n\r\nRequiert la\
        \ signature HMAC : en-tetes X-NT-TIMESTAMP, X-NT-NONCE et X-NT-SIGNATURE (voir\
        \ la description de l'API). Les SDK officiels les posent automatiquement."
