        \ est celui qui sera reellement debite : meme profil, meme organisation destinataire\
        \ (pays du wallet client) et meme reduction eventuelle.\r\n\r\nRequiert la\
        \ signature HMAC : en-tetes X-NT-TIMESTAMP, X-NT-NONCE et X-NT-SIGNATURE (voir\
        \ la description de l'API). Les SDK officiels les posent automatiquement."
      operationId: calculerFraisPartenaireToWallet
