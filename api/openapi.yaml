openapi: 3.1.0
info:
  description: |
    APIs partenaires NITA.

    Perimetre : endpoints v2 (/api/v2/**).

    Deux couches d'erreurs, a ne pas confondre :

    - TRANSPORT (vrais statuts HTTP) : 400 (corps invalide, en-tetes de
      signature absents/malformes), 401 (cle, jeton Bearer ou signature
      invalides, horodatage perime), 403 (produit non souscrit, jeton
      invalide/expire).
    - METIER : renvoyee en HTTP 200, le vrai code se trouve dans l'enveloppe
      {status, code, message, data} - par exemple 402, 404, 405, 409
      (requestId deja utilise), 500. Testez le champ `code` du corps, pas le
      seul statut HTTP.

    Signature (POST/PUT) : hex(HMAC-SHA256(secret_partenaire, timestamp + "
    " + nonce + "
    " + corps)),
    portee par X-NT-TIMESTAMP, X-NT-NONCE et X-NT-SIGNATURE. Les SDK officiels
    la calculent et la posent au niveau transport.
  title: Nita transfert d'argent | Niger Poste
  version: "1.0"
servers:
- description: Generated server url
  url: http://localhost:8584
security:
- bearerAuth: []
  ApiKey: []
tags:
- description: API v2 de vérification du statut d'une transaction
  name: Checking v2
- description: API v2 de gestion des transactions d'achat en ligne
  name: Achat en ligne v2
- description: API v2 de gestion d'un compte MyNita
  name: MyNita v2
- description: API v2 de gestion des localités NITA
  name: Localités v2
- description: API v2 de gestion des transactions. Photos transmises en Base64 dans
    le JSON body.
  name: Transactions v2
- description: API v2 de gestion de Compte de transactions
  name: Compte v2
- description: Envois de fonds entre partenaires (P2P / B2B) — API v2
  name: Envoi inter-partenaire v2
paths:
  /api/v2/nitaServices/account/balance:
    get:
      description: Permet de récupérer le solde du compte de stock.
      operationId: consulterSoldeCompte
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApisResponseV2Double'
          description: Solde principal récupéré avec succès
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApisResponseV2Double'
          description: Compte non trouvé
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApisResponseV2Double'
          description: Erreur interne du serveur
        "401":
          description: "Authentification refusee : cle X-NT-API-KEY absente ou invalide,\
            \ jeton Bearer absent, signature HMAC invalide, horodatage perime."
        "403":
          description: "Acces refuse : produit non souscrit par le partenaire, ou\
            \ jeton Bearer invalide/expire."
      summary: Consulter le solde du compte
      tags:
      - Compte v2
  /api/v2/nitaServices/achatEnLigne/annulerAchat:
    put:
      description: "Annule un achat via son codeAchat. L'achat doit être au statut\
        \ 'non payer'.\r\n\r\nRequiert la signature HMAC : en-tetes X-NT-TIMESTAMP,\
        \ X-NT-NONCE et X-NT-SIGNATURE (voir la description de l'API). Les SDK officiels\
        \ les posent automatiquement."
      operationId: annulerAchat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnulationAchatDto'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApisResponseV2CheckAchatStatusResponseV2'
          description: Achat annule avec succes
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApisResponseV2'
          description: Statut invalide pour annulation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApisResponseV2'
          description: Erreur interne
        "401":
          description: "Authentification refusee : cle X-NT-API-KEY absente ou invalide,\
            \ jeton Bearer absent, signature HMAC invalide, horodatage perime."
        "403":
          description: "Acces refuse : produit non souscrit par le partenaire, ou\
            \ jeton Bearer invalide/expire."
      summary: Annuler un achat
      tags:
      - Achat en ligne v2
  /api/v2/nitaServices/achatEnLigne/checkAchatStatus:
    post:
      description: "Vérifie le statut d'un achat en ligne via le requestId.\r\n\r\n\
        Requiert la signature HMAC : en-tetes X-NT-TIMESTAMP, X-NT-NONCE et X-NT-SIGNATURE\
        \ (voir la description de l'API). Les SDK officiels les posent automatiquement."
      operationId: checkAchatStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAchatStatusModel'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApisResponseV2CheckAchatStatusResponseV2'
          description: Statut de l'achat recupere avec succes
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApisResponseV2'
          description: Achat introuvable
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApisResponseV2'
          description: Erreur interne
        "400":
          description: "Requete invalide : corps non conforme (validation), ou en-tetes\
            \ de signature absents/malformes."
        "401":
          description: "Authentification refusee : cle X-NT-API-KEY absente ou invalide,\
            \ jeton Bearer absent, signature HMAC invalide, horodatage perime."
        "403":
          description: "Acces refuse : produit non souscrit par le partenaire, ou\
            \ jeton Bearer invalide/expire."
