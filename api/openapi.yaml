        "400":
          description: "Requete invalide : corps non conforme (validation), ou en-tetes\
            \ de signature absents/malformes."
        "401":
          description: "Authentification refusee : cle X-NT-API-KEY absente ou invalide,\
            \ jeton Bearer absent, signature HMAC invalide, horodatage perime."
